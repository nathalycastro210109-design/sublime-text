<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pantalla de Login</title>

  <!-- Vinculación al CSS -->
  <link rel="stylesheet" href="css/estiloinicio.css" />
</head>
<body>

  <div class="fondo"></div>

  <header class="navbar">
    <div class="logo"><img src="img/milugarlogo.png" alt="Mi Lugar Logo" style="height: 40px;"></div>
    <nav>
      <ul class="nav-links">
        <li><a href="#">Inicio</a></li>
        <li><a href="#">Nosotros</a></li>
        <li><a href="#">Servicios</a></li>
        <li><a href="#">Contacto</a></li>
      </ul>
    </nav>
  </header>

  <div class="login-container">
    <form class="login-box">
      <h2>Iniciar Sesión</h2>

      <label for="email">Correo electrónico</label>
      <input type="email" id="email" placeholder="Introduce tu correo" required>

      <label for="password">Contraseña</label>
      <input type="password" id="password" placeholder="Introduce tu contraseña" required>

      <div class="options">
        <label><input type="checkbox"> Recordarme</label>
        <a href="#">¿Olvidaste tu contraseña?</a>
      </div>

      <button type="submit" class="login-button">Entrar</button>

      <p class="register-text">¿No tienes cuenta? <a href="#">Regístrate</a></p>
    </form>
  </div>

</body>
</html>
